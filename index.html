<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的 TOEIC 字卡</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #000;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(100%, 640px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 32px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #a1a1a8;
      font-size: 28px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .folder-list {
      display: grid;
      gap: 22px;
      margin-top: 46px;
    }

    .folder-item {
      width: 100%;
      border: 1px solid #252529;
      border-radius: 24px;
      background: #1c1c1e;
      box-shadow: 0 14px 28px rgba(18, 18, 28, 0.34);
      min-height: 148px;
      padding: 34px 38px;
      color: #fff;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      text-align: left;
    }

    .folder-language,
    .folder-count {
      color: #8e8e93;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }

    .folder-name {
      grid-column: 1 / -1;
      color: #fff;
      font-size: 40px;
      line-height: 1.15;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .study-header {
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      margin-bottom: 22px;
    }

    .back-button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: #1c1c1e;
      color: #70a7ff;
      font-size: 34px;
      line-height: 1;
    }

    .card-area {
      perspective: 1200px;
      touch-action: pan-y;
    }

    .card {
      position: relative;
      width: 100%;
      height: 560px;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      transform-style: preserve-3d;
      transition: transform 0.45s ease;
      user-select: none;
      touch-action: none;
    }

    .card.dragging {
      transition: none;
    }

    .card.flipped {
      transform: rotateY(180deg);
      touch-action: pan-y;
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0)),
        #1c1c1e;
      backface-visibility: hidden;
      padding: 36px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.48);
    }

    .card-front {
      align-items: center;
      justify-content: center;
    }

    .word {
      width: 100%;
      overflow-wrap: anywhere;
      text-align: center;
      font-size: 52px;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: 0;
    }

    .card-back {
      transform: rotateY(180deg);
      align-items: stretch;
      justify-content: flex-start;
      gap: 18px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .phonetic {
      color: #bf5af2;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .detail,
    .frequent {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 21px;
      line-height: 1.55;
      letter-spacing: 0;
      font-family: inherit;
    }

    .detail {
      color: #f2f2f7;
    }

    .frequent {
      color: #30d158;
      font-weight: 650;
    }

    .detail strong,
    .frequent strong {
      font-weight: 850;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .nav-button {
      flex: 1;
      min-height: 52px;
      border: none;
      border-radius: 8px;
      background: #30d158;
      color: #000;
      font-size: 18px;
      font-weight: 700;
    }

    .empty-state {
      margin-top: 52px;
      border: 1px solid #252529;
      border-radius: 24px;
      background: #1c1c1e;
      padding: 42px 26px;
      text-align: center;
      color: #8e8e93;
      font-size: 22px;
      line-height: 1.5;
      font-weight: 700;
    }

    #counter {
      margin: 20px 0 0;
      text-align: center;
      color: #8e8e93;
      font-size: 16px;
    }

    [hidden] {
      display: none;
    }

    .gesture-debug {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 20;
      width: min(92vw, 360px);
      max-height: 96px;
      overflow: hidden;
      border: 1px solid rgba(112, 167, 255, 0.4);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.76);
      color: #c7d7ff;
      padding: 6px 8px;
      font-family: Consolas, Monaco, monospace;
      font-size: 10px;
      line-height: 1.25;
      pointer-events: none;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      .app {
        padding: 22px 16px 28px;
      }

      h1 {
        font-size: 26px;
      }

      .folder-list {
        gap: 18px;
        margin-top: 38px;
      }

      .folder-item {
        min-height: 142px;
        padding: 30px 30px;
      }

      .folder-language,
      .folder-count {
        font-size: 22px;
      }

      .folder-name {
        font-size: 36px;
      }

      .card {
        height: calc(100vh - 148px);
        min-height: 430px;
        max-height: 620px;
      }

      .card-face {
        padding: 28px;
      }

      .word {
        font-size: 44px;
      }

      .phonetic {
        font-size: 24px;
      }

      .detail,
      .frequent {
        font-size: 18px;
        line-height: 1.5;
      }

      .buttons {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section id="folderView" class="screen active">
      <h1 id="folderCountTitle"></h1>
      <div id="folderList" class="folder-list"></div>
    </section>

    <section id="cardView" class="screen">
      <div class="study-header">
        <button id="backButton" class="back-button" type="button" aria-label="回資料夾">‹</button>
        <h1 id="deckTitle"></h1>
        <div></div>
      </div>

      <div id="studyArea">
        <div class="card-area">
          <section id="card" class="card" aria-label="TOEIC vocabulary flashcard">
            <div class="card-face card-front">
              <div id="word" class="word"></div>
            </div>

            <div class="card-face card-back">
              <div id="phonetic" class="phonetic"></div>
              <pre id="detail" class="detail"></pre>
              <pre id="frequent" class="frequent"></pre>
            </div>
          </section>
        </div>

        <div class="buttons" aria-label="字卡切換">
          <button class="nav-button" type="button" id="prevButton">上一張</button>
          <button class="nav-button" type="button" id="nextButton">下一張</button>
        </div>

        <p id="counter"></p>
      </div>

      <div id="emptyState" class="empty-state" hidden>這個資料夾目前沒有卡片</div>
    </section>
  </main>

  <div id="gestureDebug" class="gesture-debug" hidden></div>

  <script>
