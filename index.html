<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的 TOEIC 字卡</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #000;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(100%, 640px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 32px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #a1a1a8;
      font-size: 28px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .folder-list {
      display: grid;
      gap: 22px;
      margin-top: 46px;
    }

    .folder-item {
      width: 100%;
      border: 1px solid #252529;
      border-radius: 24px;
      background: #1c1c1e;
      box-shadow: 0 14px 28px rgba(18, 18, 28, 0.34);
      min-height: 148px;
      padding: 34px 38px;
      color: #fff;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      text-align: left;
    }

    .folder-language,
    .folder-count {
      color: #8e8e93;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }

    .folder-name {
      grid-column: 1 / -1;
      color: #fff;
      font-size: 40px;
      line-height: 1.15;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .study-header {
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      margin-bottom: 22px;
    }

    .back-button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: #1c1c1e;
      color: #70a7ff;
      font-size: 34px;
      line-height: 1;
    }

    .card-area {
      perspective: 1200px;
      touch-action: pan-y;
    }

    .card {
      position: relative;
      width: 100%;
      height: 560px;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      transform-style: preserve-3d;
      transition: transform 0.45s ease;
      user-select: none;
      touch-action: none;
    }

    .card.dragging {
      transition: none;
    }

    .card.flipped {
      transform: rotateY(180deg);
      touch-action: pan-y;
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0)),
        #1c1c1e;
      backface-visibility: hidden;
      padding: 36px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.48);
    }

    .card-front {
      align-items: center;
      justify-content: center;
    }

    .word {
      width: 100%;
      overflow-wrap: anywhere;
      text-align: center;
      font-size: 52px;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: 0;
    }

    .card-back {
      transform: rotateY(180deg);
      align-items: stretch;
      justify-content: flex-start;
      gap: 18px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .phonetic {
      color: #bf5af2;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .detail,
    .frequent {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 21px;
      line-height: 1.55;
      letter-spacing: 0;
      font-family: inherit;
    }

    .detail {
      color: #f2f2f7;
    }

    .frequent {
      color: #30d158;
      font-weight: 650;
    }

    .detail strong,
    .frequent strong {
      font-weight: 850;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .nav-button {
      flex: 1;
      min-height: 52px;
      border: none;
      border-radius: 8px;
      background: #30d158;
      color: #000;
      font-size: 18px;
      font-weight: 700;
    }

    .empty-state {
      margin-top: 52px;
      border: 1px solid #252529;
      border-radius: 24px;
      background: #1c1c1e;
      padding: 42px 26px;
      text-align: center;
      color: #8e8e93;
      font-size: 22px;
      line-height: 1.5;
      font-weight: 700;
    }

    #counter {
      margin: 20px 0 0;
      text-align: center;
      color: #8e8e93;
      font-size: 16px;
    }

    [hidden] {
      display: none;
    }

    .gesture-debug {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 20;
      width: min(92vw, 360px);
      max-height: 96px;
      overflow: hidden;
      border: 1px solid rgba(112, 167, 255, 0.4);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.76);
      color: #c7d7ff;
      padding: 6px 8px;
      font-family: Consolas, Monaco, monospace;
      font-size: 10px;
      line-height: 1.25;
      pointer-events: none;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      .app {
        padding: 22px 16px 28px;
      }

      h1 {
        font-size: 26px;
      }

      .folder-list {
        gap: 18px;
        margin-top: 38px;
      }

      .folder-item {
        min-height: 142px;
        padding: 30px 30px;
      }

      .folder-language,
      .folder-count {
        font-size: 22px;
      }

      .folder-name {
        font-size: 36px;
      }

      .card {
        height: calc(100vh - 148px);
        min-height: 430px;
        max-height: 620px;
      }

      .card-face {
        padding: 28px;
      }

      .word {
        font-size: 44px;
      }

      .phonetic {
        font-size: 24px;
      }

      .detail,
      .frequent {
        font-size: 18px;
        line-height: 1.5;
      }

      .buttons {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section id="folderView" class="screen active">
      <h1 id="folderCountTitle"></h1>
      <div id="folderList" class="folder-list"></div>
    </section>

    <section id="cardView" class="screen">
      <div class="study-header">
        <button id="backButton" class="back-button" type="button" aria-label="回資料夾">‹</button>
        <h1 id="deckTitle"></h1>
        <div></div>
      </div>

      <div id="studyArea">
        <div class="card-area">
          <section id="card" class="card" aria-label="TOEIC vocabulary flashcard">
            <div class="card-face card-front">
              <div id="word" class="word"></div>
            </div>

            <div class="card-face card-back">
              <div id="phonetic" class="phonetic"></div>
              <pre id="detail" class="detail"></pre>
              <pre id="frequent" class="frequent"></pre>
            </div>
          </section>
        </div>

        <div class="buttons" aria-label="字卡切換">
          <button class="nav-button" type="button" id="prevButton">上一張</button>
          <button class="nav-button" type="button" id="nextButton">下一張</button>
        </div>

        <p id="counter"></p>
      </div>

      <div id="emptyState" class="empty-state" hidden>這個資料夾目前沒有卡片</div>
    </section>
  </main>

  <div id="gestureDebug" class="gesture-debug" hidden></div>

    const debugGestures = new URLSearchParams(window.location.search).get("debug") === "1";
    const gestureDebugLines = [];

    if (debugGestures) {
      gestureDebug.hidden = false;
    }

    function cloneDefaultFolders() {
      return JSON.parse(JSON.stringify(defaultFolders));
    }

    function normalizeFolders(rawFolders) {
      const normalizedFolders = rawFolders
        .filter((folder) => folder && typeof folder === "object")
        .map((folder, folderIndex) => ({
          id: folder.id || `folder-${folderIndex}`,
          language: folder.language || "English",
          name: folder.name || `資料夾 ${folderIndex + 1}`,
          cards: Array.isArray(folder.cards) ? folder.cards : []
        }));

      return normalizedFolders.length > 0 ? normalizedFolders : cloneDefaultFolders();
    }

    function syncDefaultFolders(savedFolders) {
      const nextFolders = normalizeFolders(savedFolders);
      const defaults = cloneDefaultFolders();
      const defaultIds = defaults.map((folder) => folder.id);
      const customFolders = nextFolders.filter((folder) => !defaultIds.includes(folder.id));

      return [...defaults, ...customFolders];
    }

    function loadFolders() {
      const savedFolders = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);

      if (!savedFolders) {
        return cloneDefaultFolders();
      }

      try {
        const parsedFolders = JSON.parse(savedFolders);
        return Array.isArray(parsedFolders) ? syncDefaultFolders(parsedFolders) : cloneDefaultFolders();
      } catch {
        return cloneDefaultFolders();
      }
    }

    function saveFolders() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(folders));
    }

    function isMobileLayout() {
      return window.matchMedia("(max-width: 600px)").matches;
    }

    function getSwipeDirection(deltaX, deltaY) {
      const absX = Math.abs(deltaX);
      const absY = Math.abs(deltaY);

      if (absX > 35 && absX > absY * 1.35) {
        return deltaX < 0 ? -1 : 1;
      }

      return 0;
    }

    function directionLabel(direction) {
      if (direction < 0) {
        return "L";
      }

      if (direction > 0) {
        return "R";
      }

      return "-";
    }

    function logGesture(eventName, data = {}) {
      if (!debugGestures) {
        return;
      }

      const parts = [eventName];

      if (Number.isFinite(data.dx)) {
        parts.push(`dx=${Math.round(data.dx)}`);
      }

      if (Number.isFinite(data.dy)) {
        parts.push(`dy=${Math.round(data.dy)}`);
      }

      if ("dir" in data) {
        parts.push(`dir=${directionLabel(data.dir)}`);
      }

      if ("drag" in data) {
        parts.push(`drag=${data.drag ? 1 : 0}`);
      }

      if (data.result) {
        parts.push(`result=${data.result}`);
      }

      gestureDebugLines.push(parts.join(" "));

      while (gestureDebugLines.length > 5) {
        gestureDebugLines.shift();
      }

      gestureDebug.textContent = gestureDebugLines.join("\n");
    }

    function setOptionalText(element, text) {
      element.textContent = text || "";
      element.hidden = !text;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderRichText(text) {
      return escapeHtml(text || "").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function setOptionalRichText(element, text) {
      element.innerHTML = renderRichText(text);
      element.hidden = !text;
    }

    function getCardTransform(offsetX = 0, tilt = 0) {
      const flip = flipped ? " rotateY(180deg)" : "";
      return `translateX(${offsetX}px) rotate(${tilt}deg)${flip}`;
    }

    function setCardPosition(offsetX = 0, tilt = 0, transition = "") {
      card.style.transition = transition;
      card.style.transform = getCardTransform(offsetX, tilt);
    }

    function resetCardPosition(transition = "") {
      card.classList.remove("dragging");
      setCardPosition(0, 0, transition);
    }

    function suppressUpcomingClick(duration = 450) {
      suppressNextClick = true;

      window.setTimeout(() => {
        suppressNextClick = false;
      }, duration);
    }

    function finishSwipe(direction) {
      const exitX = direction * Math.max(window.innerWidth, 420);
      const exitTilt = direction * 9;
      const enterX = -direction * Math.max(window.innerWidth, 420);

      cardAnimating = true;
      suppressUpcomingClick();
      setCardPosition(exitX, exitTilt, "transform 0.22s ease");

      window.setTimeout(() => {
        if (direction < 0) {
          nextCard();
        } else {
          prevCard();
        }

        setCardPosition(enterX, -exitTilt, "none");

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            resetCardPosition("transform 0.24s ease-out");
            window.setTimeout(() => {
              cardAnimating = false;
            }, 260);
          });
        });
      }, 220);
    }

    function renderFolders() {
      folderCountTitle.textContent = `${folders.length} 個資料夾`;
      folderList.replaceChildren();

      folders.forEach((folder, folderIndex) => {
        const folderItem = document.createElement("button");
        const cardCount = folder.cards.length;

        folderItem.className = "folder-item";
        folderItem.type = "button";
        folderItem.innerHTML = `
          <span class="folder-language"></span>
          <span class="folder-count"></span>
          <span class="folder-name"></span>
        `;

        folderItem.querySelector(".folder-language").textContent = folder.language || "English";
        folderItem.querySelector(".folder-count").textContent = `${cardCount} 張卡片`;
        folderItem.querySelector(".folder-name").textContent = folder.name;
        folderItem.addEventListener("click", () => openFolder(folderIndex));
        folderList.appendChild(folderItem);
      });
    }

    function showFolderView() {
      folderView.classList.add("active");
      cardView.classList.remove("active");
      renderFolders();
    }

    function openFolder(folderIndex) {
      activeFolderIndex = folderIndex;
      cardIndex = 0;
      flipped = false;

      folderView.classList.remove("active");
      cardView.classList.add("active");
      deckTitle.textContent = folders[activeFolderIndex].name;
      showCard();
    }

    function showCard() {
      const currentFolder = folders[activeFolderIndex];
      const cards = currentFolder.cards;

      if (cards.length === 0) {
        studyArea.hidden = true;
        emptyState.hidden = false;
        return;
      }

      const cardData = cards[cardIndex];

      studyArea.hidden = false;
      emptyState.hidden = true;
      word.textContent = cardData.word;
      setOptionalText(phonetic, cardData.phonetic);
      setOptionalRichText(detail, cardData.detail);
      setOptionalRichText(frequent, cardData.frequent);
      counter.textContent = `${cardIndex + 1} / ${cards.length}`;

      flipped = false;
      card.classList.remove("flipped");
      resetCardPosition("none");
    }

    function flipCard() {
      flipped = !flipped;
      card.classList.toggle("flipped", flipped);
      resetCardPosition("transform 0.45s ease");
    }

    function nextCard() {
      const cards = folders[activeFolderIndex].cards;

      if (cards.length === 0) {
        return;
      }

      cardIndex = (cardIndex + 1) % cards.length;
      showCard();
    }

    function prevCard() {
      const cards = folders[activeFolderIndex].cards;

      if (cards.length === 0) {
        return;
      }

      cardIndex = (cardIndex - 1 + cards.length) % cards.length;
      showCard();
    }

    card.addEventListener("click", () => {
      if (cardAnimating || suppressNextClick) {
        suppressNextClick = false;
        return;
      }

      flipCard();
    });

    card.addEventListener("pointerdown", (event) => {
      if (!isMobileLayout() || event.pointerType !== "touch" || flipped || cardAnimating) {
        return;
      }

      pointerStartX = event.clientX;
      pointerStartY = event.clientY;
      lastDeltaX = 0;
      lastDeltaY = 0;
      trackingTouch = true;
      draggingCard = false;
      pendingSwipeDirection = 0;
      logGesture("down", { dx: 0, dy: 0, dir: 0, drag: false });

      if (card.setPointerCapture) {
        card.setPointerCapture(event.pointerId);
      }
    });

    card.addEventListener("pointermove", (event) => {
      if (!trackingTouch) {
        return;
      }

      const deltaX = event.clientX - pointerStartX;
      const deltaY = event.clientY - pointerStartY;
      const absX = Math.abs(deltaX);
      const absY = Math.abs(deltaY);

      lastDeltaX = deltaX;
      lastDeltaY = deltaY;

      if (!draggingCard && absX > 10 && absX > absY * 1.1) {
        draggingCard = true;
        card.classList.add("dragging");
      }

      if (!draggingCard) {
        return;
      }

      if (event.cancelable) {
        event.preventDefault();
      }

      pendingSwipeDirection = getSwipeDirection(deltaX, deltaY) || pendingSwipeDirection;
      logGesture("move", {
        dx: deltaX,
        dy: deltaY,
        dir: pendingSwipeDirection,
        drag: draggingCard
      });

      const limitedX = Math.max(Math.min(deltaX, 180), -180);
      setCardPosition(limitedX, limitedX * 0.035, "none");
    });

    card.addEventListener("pointerup", (event) => {
      if (!trackingTouch) {
        return;
      }

      const deltaX = event.clientX - pointerStartX;
      const deltaY = event.clientY - pointerStartY;
      lastDeltaX = deltaX;
      lastDeltaY = deltaY;
      const swipeDirection = getSwipeDirection(deltaX, deltaY) || pendingSwipeDirection;
      const result = swipeDirection < 0 ? "next" : swipeDirection > 0 ? "prev" : "bounce";

      trackingTouch = false;
      pendingSwipeDirection = 0;

      if (card.releasePointerCapture) {
        card.releasePointerCapture(event.pointerId);
      }

      if (!draggingCard) {
        return;
      }

      draggingCard = false;
      suppressUpcomingClick();

      logGesture("up", {
        dx: deltaX,
        dy: deltaY,
        dir: swipeDirection,
        drag: true,
        result
      });

      if (!swipeDirection) {
        resetCardPosition("transform 0.2s ease-out");
        return;
      }

      finishSwipe(swipeDirection);
    });

    card.addEventListener("pointercancel", (event) => {
      trackingTouch = false;
      const swipeDirection = pendingSwipeDirection || getSwipeDirection(lastDeltaX, lastDeltaY);
      const result = swipeDirection < 0 ? "next" : swipeDirection > 0 ? "prev" : "cancel";

      draggingCard = false;
      pendingSwipeDirection = 0;

      if (card.releasePointerCapture) {
        card.releasePointerCapture(event.pointerId);
      }

      if (swipeDirection) {
        suppressUpcomingClick();
        logGesture("cancel", {
          dx: lastDeltaX,
          dy: lastDeltaY,
          dir: swipeDirection,
          drag: true,
          result
        });
        finishSwipe(swipeDirection);
      } else {
        logGesture("cancel", {
          dx: lastDeltaX,
          dy: lastDeltaY,
          dir: 0,
          drag: false,
          result
        });
        resetCardPosition("transform 0.2s ease-out");
      }
    });

    backButton.addEventListener("click", showFolderView);
    prevButton.addEventListener("click", prevCard);
    nextButton.addEventListener("click", nextCard);

    renderFolders();
    saveFolders();
  </script>
</body>
</html>
